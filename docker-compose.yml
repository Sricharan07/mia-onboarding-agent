services:
  mia-backend:
    build: .
    environment:
      NODE_ENV: production
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 4000
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CORS_ORIGIN: "${CORS_ORIGIN:?Set CORS_ORIGIN to the console and host app origins}"
      DATABASE_URL: file:/app/data/sqlite/local.db
      LOCAL_UPLOAD_DIR: /app/data/uploads
      CONSOLE_DIST_DIR: /app/backend/console/dist
      MIA_SECRET_ENCRYPTION_KEY: ${MIA_SECRET_ENCRYPTION_KEY:-}
      BOOTSTRAP_ADMIN_TOKEN: ${BOOTSTRAP_ADMIN_TOKEN:-}
      CONSOLE_SESSION_TTL_SECONDS: ${CONSOLE_SESSION_TTL_SECONDS:-28800}
      CONSOLE_AUTH_RATE_LIMIT_MAX: ${CONSOLE_AUTH_RATE_LIMIT_MAX:-8}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      RUNTIME_TOKEN_TTL_SECONDS: ${RUNTIME_TOKEN_TTL_SECONDS:-900}
      RUNTIME_TOKEN_MAX_USES: ${RUNTIME_TOKEN_MAX_USES:-2000}
      RUNTIME_RATE_LIMIT_MAX: ${RUNTIME_RATE_LIMIT_MAX:-180}
      APP_RATE_LIMIT_MAX: ${APP_RATE_LIMIT_MAX:-1200}
      APP_VOICE_RATE_LIMIT_MAX: ${APP_VOICE_RATE_LIMIT_MAX:-120}
      WORKFLOW_VIDEO_MAX_BYTES: ${WORKFLOW_VIDEO_MAX_BYTES:-52428800}
      GEMINI_LIVE_TOKEN_RATE_LIMIT_MAX: ${GEMINI_LIVE_TOKEN_RATE_LIMIT_MAX:-30}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-gemini-2.5-flash}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-gemini-2.5-flash}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-3.1-flash-live-preview}
      GEMINI_TOKEN_TTL_SECONDS: ${GEMINI_TOKEN_TTL_SECONDS:-1800}
      GEMINI_NEW_SESSION_TTL_SECONDS: ${GEMINI_NEW_SESSION_TTL_SECONDS:-60}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      SEMANTIC_INDEX_DIR: /app/data/lancedb
      UI_SCAN_AUTH_MODE: ${UI_SCAN_AUTH_MODE:-none}
      UI_SCAN_LOGIN_URL: ${UI_SCAN_LOGIN_URL:-}
      UI_SCAN_USERNAME: ${UI_SCAN_USERNAME:-}
      UI_SCAN_PASSWORD: ${UI_SCAN_PASSWORD:-}
      UI_SCAN_USERNAME_SELECTOR: ${UI_SCAN_USERNAME_SELECTOR:-}
      UI_SCAN_PASSWORD_SELECTOR: ${UI_SCAN_PASSWORD_SELECTOR:-}
      UI_SCAN_SUBMIT_SELECTOR: ${UI_SCAN_SUBMIT_SELECTOR:-}
      UI_SCAN_SUCCESS_URL_PATTERN: ${UI_SCAN_SUCCESS_URL_PATTERN:-}
      UI_SCAN_POST_LOGIN_WAIT_MS: ${UI_SCAN_POST_LOGIN_WAIT_MS:-1000}
      UI_SCAN_HEADLESS: "true"
      UI_SCAN_ALLOW_PRIVATE_NETWORKS: ${UI_SCAN_ALLOW_PRIVATE_NETWORKS:-false}
    ports:
      - "4000:4000"
    volumes:
      - mia-data:/app/data
    restart: unless-stopped

volumes:
  mia-data:
