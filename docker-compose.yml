name: mia

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mia}
      POSTGRES_DB: ${POSTGRES_DB:-mia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a unique high-entropy value}
    volumes:
      - mia-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  mia-backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 4000
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN to the console and host product origins}
      DATABASE_URL: postgresql://${POSTGRES_USER:-mia}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mia}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      LOCAL_UPLOAD_DIR: /app/data/uploads
      CONSOLE_DIST_DIR: /app/backend/console/dist
      MIA_SECRET_ENCRYPTION_KEY: ${MIA_SECRET_ENCRYPTION_KEY:?Set MIA_SECRET_ENCRYPTION_KEY to at least 32 characters}
      SETUP_TOKEN: ${SETUP_TOKEN:?Set SETUP_TOKEN to at least 32 characters for first-run setup}
      CONSOLE_SESSION_TTL_SECONDS: ${CONSOLE_SESSION_TTL_SECONDS:-28800}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      RUNTIME_RATE_LIMIT_MAX: ${RUNTIME_RATE_LIMIT_MAX:-180}
      RUNTIME_TOKEN_TTL_SECONDS: ${RUNTIME_TOKEN_TTL_SECONDS:-900}
      RUNTIME_TOKEN_MAX_USES: ${RUNTIME_TOKEN_MAX_USES:-2000}
      TRANSCRIPT_RETENTION_DAYS: ${TRANSCRIPT_RETENTION_DAYS:-30}
      DATA_RETENTION_SWEEP_INTERVAL_MS: ${DATA_RETENTION_SWEEP_INTERVAL_MS:-3600000}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      PROVIDER_REQUEST_TIMEOUT_MS: ${PROVIDER_REQUEST_TIMEOUT_MS:-90000}
      PROVIDER_RETRY_ATTEMPTS: ${PROVIDER_RETRY_ATTEMPTS:-3}
      SHUTDOWN_GRACE_PERIOD_MS: ${SHUTDOWN_GRACE_PERIOD_MS:-30000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      GEMINI_PLANNER_MODEL: ${GEMINI_PLANNER_MODEL:-gemini-3.5-flash}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-gemini-3.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      GEMINI_EMBEDDING_DIMENSIONS: 768
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-3.1-flash-live-preview}
      GEMINI_TOKEN_TTL_SECONDS: ${GEMINI_TOKEN_TTL_SECONDS:-1800}
      GEMINI_NEW_SESSION_TTL_SECONDS: ${GEMINI_NEW_SESSION_TTL_SECONDS:-60}
      UI_SCAN_HEADLESS: "true"
      UI_SCAN_ALLOW_PRIVATE_NETWORKS: ${UI_SCAN_ALLOW_PRIVATE_NETWORKS:-false}
    ports:
      - "${MIA_PORT:-4000}:4000"
    volumes:
      - mia-uploads:/app/data/uploads
    tmpfs:
      - /tmp:size=1g
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  mia-postgres:
  mia-uploads:
