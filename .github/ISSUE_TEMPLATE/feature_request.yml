name: Feature request
description: Propose a focused improvement to Mia.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Explain who is blocked and what they cannot accomplish today.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the user-visible result without prescribing an implementation.
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: Primary audience
      options:
        - Product user
        - Mia console operator
        - SDK integrator
        - Self-hosted administrator
        - Contributor
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, constraints, or alternatives considered.
