name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
        env:
          POSTGRES_USER: mia
          POSTGRES_PASSWORD: mia-ci-database-password
          POSTGRES_DB: mia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mia -d mia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MIA_TEST_DATABASE_URL: postgres://mia:mia-ci-database-password@127.0.0.1:5432/mia_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root workspace dependencies
        run: npm ci

      - name: Test backend and SDK
        run: npm run test

      - name: Build backend and SDK
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Validate SDK package contents
        run: npm run pack:sdk

      - name: Install console dependencies
        run: npm ci --prefix backend/console

      - name: Build console
        run: npm run build:console

      - name: Audit console production dependencies
        run: npm --prefix backend/console audit --omit=dev

      - name: Install SDK demo dependencies
        run: npm ci --prefix example/demo-crm+sdk

      - name: Check SDK demo source
        run: npm run check:demo

      - name: Build SDK demo
        run: npm run build:demo

      - name: Verify packaged SDK in an isolated demo
        run: npm run verify:package-install

      - name: Audit SDK demo production dependencies
        run: npm --prefix example/demo-crm+sdk audit --omit=dev

  docker:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: mia-ci
      POSTGRES_PASSWORD: mia-ci-database-password
      CORS_ORIGIN: http://localhost:4000,http://localhost:3000
      MIA_SECRET_ENCRYPTION_KEY: mia-ci-encryption-key-with-32-characters
      SETUP_TOKEN: mia-ci-setup-token-with-32-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start an empty deployment
        run: docker compose up --build --detach

      - name: Check readiness and first-run setup
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/api/v1/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Complete secure first-run setup
        run: |
          curl -fsS http://localhost:4000/api/v1/setup/status | grep -q '"setupRequired":true'
          curl -fsS -X POST http://localhost:4000/api/v1/setup \
            -H 'content-type: application/json' \
            --data '{"setupToken":"mia-ci-setup-token-with-32-characters","productName":"Mia CI Product","origin":"http://localhost:3000","adminEmail":"admin@example.com","adminName":"CI Admin","password":"mia-ci-admin-password"}' \
            | grep -q '"token":"mia_admin_'
          curl -fsS http://localhost:4000/api/v1/setup/status | grep -q '"setupRequired":false'

      - name: Check bundled console
        run: curl -fsS http://localhost:4000/ | grep -q '<div id="root">'

      - name: Stop deployment
        if: always()
        run: docker compose down --volumes --remove-orphans
